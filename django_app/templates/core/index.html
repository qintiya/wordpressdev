<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projects · Django</title></head>
<body>
  <main>
    <h1>Projects</h1>
    {% for project in projects %}<article><h2>{{ project.title }}</h2><p>{{ project.summary|linebreaksbr }}</p></article>{% empty %}<p>Belum ada proyek yang dipublikasikan.</p>{% endfor %}
  </main>
</body>
</html>
